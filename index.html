<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; media-src 'self'; worker-src 'none'; upgrade-insecure-requests"
  />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Timer</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main>
    <div class="timer-slot">
      <div id="timer" class="timer">25:00</div>
      <input
        id="timer-input"
        class="timer timer-input"
        type="text"
        inputmode="numeric"
        value="25:00"
        aria-label="Timer duration"
      />
    </div>

    <div class="controls">
      <button id="toggle">Start</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </main>
  <script src="./app.js"></script>
</body>

</html>
